# "Say it differently": a tiny Cloudflare Worker that rewords one phrase with Workers AI.
# No AI provider key: the model runs on Cloudflare through the AI binding. Deploy: cd worker && npx wrangler deploy (Node 22)
name = "say-it-reword"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

# Free-tier friendly limit: 20 rewrites per minute per visitor.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://mhccog.github.io,http://localhost:5173,http://localhost:4173"
MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
